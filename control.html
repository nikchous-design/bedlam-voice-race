<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Самый быстрый шприц — диджей</title><link rel="stylesheet" href="/styles.css"></head><body class="med-body"><div class="presenter-shell med-shell"><div class="presenter-top"><div><div class="presenter-brand">💉 САМЫЙ БЫСТРЫЙ ШПРИЦ</div><div class="presenter-meta">ПАНЕЛЬ ДИДЖЕЯ · старт от 2 · максимум 17</div></div><div><div class="presenter-meta">КОМНАТА</div><div id="roomCode" class="room"></div></div></div><div class="presenter-grid"><section class="panel"><h2>Управление</h2><div class="presenter-actions"><button id="startBtn" class="btn start">▶ СТАРТ</button><button id="screenBtn" class="btn screen-btn">▣ ЭКРАН ПРОЕКТОРА</button><button id="resetBtn" class="btn">↺ СБРОС</button><button id="newBtn" class="btn">НОВАЯ КОМНАТА</button><button id="clearBtn" class="btn danger">УБРАТЬ УЧАСТНИКОВ</button></div><div id="status" class="control-status">Подключаемся…</div><h2>Участники <span id="count">0/17</span></h2><div id="players" class="control-list"></div></section><aside class="panel"><h2>Подключение</h2><img id="qr" class="qr" style="width:min(100%,300px);height:auto;margin:auto"><div class="control-links" id="joinUrl"></div></aside></div></div><script>
let room=sessionStorage.getItem('syringeRaceRoom')||Math.random().toString(36).slice(2,6).toUpperCase();sessionStorage.setItem('syringeRaceRoom',room);let ws,state={players:[],running:false,winner:null};const $=x=>document.getElementById(x),wurl=()=>(location.protocol==='https:'?'wss://':'ws://')+location.host,jurl=()=>location.origin+'/join/'+room,surl=()=>location.origin+'/screen?room='+room;function setup(){$('roomCode').textContent=room;$('joinUrl').textContent=jurl();$('qr').src='/qr?text='+encodeURIComponent(jurl())}function connect(){ws=new WebSocket(wurl());ws.onopen=()=>ws.send(JSON.stringify({type:'control_join',room}));ws.onclose=()=>setTimeout(connect,1000);ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='state'){state=m;render()}if(m.type==='need_players')$('status').textContent='Нужно минимум 2 участника.'}}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function render(){let p=state.players.filter(x=>x.connected);$('count').textContent=p.length+'/17';$('startBtn').disabled=state.running||p.length<2;$('players').innerHTML=p.map((x,i)=>`<div class="control-player"><span>${i+1}. ${x.name}</span><div class="control-level med-level"><i style="width:${x.level*100}%"></i></div></div>`).join('')||'Ждём участников…';$('status').textContent=state.winner?'🏆 Победитель: '+state.winner.name:state.running?'🔊 ЗАЕЗД ИДЁТ!':p.length>=2?'✅ Можно стартовать':'Ждём минимум 2 участников'}$('startBtn').onclick=()=>send({type:'start'});$('resetBtn').onclick=()=>send({type:'reset'});$('clearBtn').onclick=()=>send({type:'clear_players'});$('screenBtn').onclick=()=>window.open(surl(),'screen','width=1400,height=900');$('newBtn').onclick=()=>{room=Math.random().toString(36).slice(2,6).toUpperCase();sessionStorage.setItem('syringeRaceRoom',room);setup();ws.close()};setup();connect();</script></body></html>
