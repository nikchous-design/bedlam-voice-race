<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEDLAM VOICE RACE</title><link rel="stylesheet" href="/styles.css"></head><body><div class="wrap"><div class="top"><div><h1 class="title">BEDLAM VOICE RACE</h1><div class="subtitle">Громче голос — быстрее гонщик.</div></div><div class="controls"><button class="btn primary" id="startBtn">СТАРТ</button><button class="btn" id="resetBtn">СБРОС</button><button class="btn" id="newBtn">НОВАЯ КОМНАТА</button><button class="btn" id="fullBtn">НА ВЕСЬ ЭКРАН</button></div></div><div class="panel" style="margin-top:20px"><div class="roomBox"><img class="qr" id="qr"><div><div class="small">Игроки сканируют QR:</div><div class="code" id="code"></div><div class="small" id="joinUrl"></div><div class="small" id="conn">Подключение…</div></div></div></div><div id="race" class="race"></div></div><div id="countdown" class="countdown"></div><div id="winner" class="winner"><div class="panel" style="text-align:center"><div style="font-size:90px">🏆</div><div class="small">ПОБЕДИТЕЛЬ</div><div id="winnerName" class="winnerName"></div><button class="btn primary" id="againBtn">РЕВАНШ</button></div></div><script>
const cars=['🏎️','🚗','🚙','🚕','🚓','🚘','🛻','🚖'];let room=sessionStorage.getItem('vrroom')||Math.random().toString(36).slice(2,6).toUpperCase();sessionStorage.setItem('vrroom',room);let ws,state={players:[],running:false,winner:null};const $=x=>document.getElementById(x);function wsu(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}function ju(){return location.origin+'/join/'+room}function setup(){$('code').textContent=room;$('joinUrl').textContent=ju();$('qr').src='/qr?text='+encodeURIComponent(ju())}function connect(){ws=new WebSocket(wsu());ws.onopen=()=>{$('conn').textContent='Сервер подключён';ws.send(JSON.stringify({type:'host_join',room}))};ws.onclose=()=>setTimeout(connect,1200);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){state=m;render()}}}function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function render(){const r=$('race');r.innerHTML=state.players.length?state.players.map((p,i)=>`<div class="lane"><div class="name">${p.name}</div><div class="meter"><i style="width:${(p.level||0)*100}%"></i></div><div class="car" style="left:${4+(Math.min(100,p.position||0)/100)*90}%">${cars[i%cars.length]}</div></div>`).join(''):'<div class="panel empty">Пока никто не подключился.</div>';$('startBtn').disabled=!state.players.length||state.running;if(state.winner){$('winnerName').textContent=state.winner.name;$('winner').classList.add('show')}else $('winner').classList.remove('show')}async function start(){if(!state.players.length)return;$('countdown').classList.add('show');for(const x of ['3','2','1','GO!']){$('countdown').textContent=x;await new Promise(r=>setTimeout(r,650))}$('countdown').classList.remove('show');send({type:'start'})}setup();connect();$('startBtn').onclick=start;$('againBtn').onclick=()=>{$('winner').classList.remove('show');start()};$('resetBtn').onclick=()=>send({type:'reset'});$('newBtn').onclick=()=>{room=Math.random().toString(36).slice(2,6).toUpperCase();sessionStorage.setItem('vrroom',room);setup();send({type:'host_join',room})};$('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();
</script></body></html>
