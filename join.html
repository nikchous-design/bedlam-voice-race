<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Игрок</title><link rel="stylesheet" href="/styles.css"></head><body><div class="joinWrap"><div class="panel joinCard"><div id="entry"><div class="small">BEDLAM VOICE RACE</div><h1>Подключиться</h1><input id="name" class="input" maxlength="24" placeholder="Твоё имя"><button id="joinBtn" class="bigBtn btn primary">ВОЙТИ В ГОНКУ</button></div><div id="micStep" class="hidden"><h1>Разреши микрофон</h1><button id="micBtn" class="bigBtn btn primary">ВКЛЮЧИТЬ МИКРОФОН</button><div id="micError" class="small"></div></div><div id="calStep" class="hidden"><h1>Калибровка</h1><p class="subtitle">Говори громко 2 секунды.</p><div class="levelBig"><i id="calMeter"></i></div><button id="calBtn" class="bigBtn btn primary">КАЛИБРОВАТЬ 2 СЕКУНДЫ</button></div><div id="game" class="hidden"><h1 id="hello"></h1><div id="status" class="status">Жди старта ведущего</div><div class="levelBig"><i id="meter"></i></div></div></div></div><script>
const room=location.pathname.split('/').filter(Boolean).pop().toUpperCase();let ws,joined=false,name='',analyser,data,maxCal=.12;const $=x=>document.getElementById(x);function wsu(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}function connect(){ws=new WebSocket(wsu());ws.onclose=()=>setTimeout(connect,1200);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined')joined=true;if(m.type==='state'&&!$('game').classList.contains('hidden')){$('status').textContent=m.winner?(m.winner.name===name?'🏆 ТЫ ПОБЕДИЛ!':'Финиш! Победил: '+m.winner.name):(m.running?'🔥 ГАЗУЙ ГОЛОСОМ!':'Жди старта ведущего')}}}connect();$('joinBtn').onclick=()=>{name=$('name').value.trim()||'Игрок';$('entry').classList.add('hidden');$('micStep').classList.remove('hidden')};$('micBtn').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);data=new Uint8Array(analyser.fftSize);$('micStep').classList.add('hidden');$('calStep').classList.remove('hidden');loop()}catch(e){$('micError').textContent='Не получилось открыть микрофон. Проверь разрешение браузера.'}};function raw(){if(!analyser)return 0;analyser.getByteTimeDomainData(data);let s=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;s+=v*v}return Math.sqrt(s/data.length)}function norm(r){const n=.008;return Math.max(0,Math.min(1,(r-n)/Math.max(.02,maxCal-n)))}function loop(){const r=raw();$('calMeter').style.width=Math.min(100,r/.35*100)+'%';const n=norm(r);$('meter').style.width=n*100+'%';if(joined&&ws.readyState===1)ws.send(JSON.stringify({type:'level',level:n}));requestAnimationFrame(loop)}$('calBtn').onclick=async()=>{let mx=0;const st=performance.now();while(performance.now()-st<2000){mx=Math.max(mx,raw());await new Promise(r=>setTimeout(r,30))}maxCal=Math.max(.03,mx);$('calStep').classList.add('hidden');$('game').classList.remove('hidden');$('hello').textContent=name;const j=()=>ws.send(JSON.stringify({type:'player_join',room,name}));if(ws.readyState===1)j();else{const t=setInterval(()=>{if(ws.readyState===1){clearInterval(t);j()}},100)}};
</script></body></html>
