<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Самый быстрый шприц</title><link rel="stylesheet" href="/styles.css"></head><body class="join-page med-body"><main class="join-card med-join"><div class="med-cross">✚</div><h1>💉 Самый быстрый шприц</h1><p>Введи имя и кричи. Чем громче — тем быстрее твой шприц!</p><div id="setup"><input id="name" class="input" maxlength="24" placeholder="Твоё имя"><button id="go" class="btn start">ПОДКЛЮЧИТЬСЯ</button></div><div id="mic" style="display:none"><div id="status" class="control-status">Микрофон…</div><div class="meter"><i id="meter"></i></div><div class="med-big" id="level">0%</div></div></main><script>
const room=location.pathname.split('/').pop().toUpperCase(),$=x=>document.getElementById(x);let ws,joined=false,base=.02,a,d;let id=localStorage.getItem('syringeRaceClientId')||crypto.randomUUID();localStorage.setItem('syringeRaceClientId',id);const wurl=()=>(location.protocol==='https:'?'wss://':'ws://')+location.host;function connect(name){ws=new WebSocket(wurl());ws.onopen=()=>ws.send(JSON.stringify({type:'player_join',room,clientId:id,name}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){joined=true;$('status').textContent='ГОТОВ! 🔊'}if(m.type==='room_full'){alert('Все 17 мест заняты');location.reload()}if(m.type==='cleared')location.reload();if(m.type==='state'&&m.winner)$('status').textContent=m.winner.clientId===id?'🏆 ТЫ ПОБЕДИЛ!':'Победил '+m.winner.name}}async function mic(){let s=await navigator.mediaDevices.getUserMedia({audio:true}),c=new AudioContext(),src=c.createMediaStreamSource(s);a=c.createAnalyser();a.fftSize=1024;d=new Uint8Array(a.fftSize);src.connect(a);$('status').textContent='Калибровка 2 секунды…';let v=[],end=performance.now()+2000;while(performance.now()<end){v.push(rms());await new Promise(r=>setTimeout(r,50))}base=Math.max(.008,v.reduce((x,y)=>x+y,0)/v.length*1.8);loop()}function rms(){a.getByteTimeDomainData(d);let s=0;for(let v of d){let x=(v-128)/128;s+=x*x}return Math.sqrt(s/d.length)}function loop(){let l=Math.max(0,Math.min(1,(rms()-base)/Math.max(.04,.22-base)));$('meter').style.width=l*100+'%';$('level').textContent=Math.round(l*100)+'%';if(joined&&ws?.readyState===1)ws.send(JSON.stringify({type:'level',level:l}));requestAnimationFrame(loop)}$('go').onclick=async()=>{let n=$('name').value.trim();if(!n)return alert('Введи имя');$('setup').style.display='none';$('mic').style.display='block';connect(n);try{await mic()}catch{$('status').textContent='Разреши доступ к микрофону'}};</script></body></html>
