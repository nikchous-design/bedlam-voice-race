<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Самый быстрый шприц</title><link rel="stylesheet" href="/styles.css"></head><body class="med-body"><div class="med-screen"><header class="med-header"><div class="med-kicker">СВАДЕБНАЯ МЕДИЦИНА ПРЕДСТАВЛЯЕТ</div><h1>💉 САМЫЙ БЫСТРЫЙ ШПРИЦ</h1><div id="subtitle">Кто громче — тот быстрее доберётся до 🍑!</div></header><section id="lobby" class="med-lobby"><div class="med-card"><div class="med-cross">✚</div><h2>УЧАСТНИКИ</h2><div id="count" class="med-big">0 / 17</div><div>старт от 2 человек</div></div><div class="screen-qr med-qr"><h2>СКАНИРУЙ QR</h2><img id="qr" class="qr"><div id="roomCode" class="room"></div></div><div class="med-card"><div class="rings">💍</div><h2>СВАДЕБНЫЙ ЗАЕЗД</h2><div class="med-note">Кричи громче — разгоняй свой шприц!</div></div></section><section id="race" class="syringe-race"><div class="race-head"><span>СТАРТ 💉</span><span>🍑 ФИНИШ</span></div><div id="lanes" class="lanes"></div><div id="winner" class="med-winner"><div class="winner-icon">💉 → 🍑</div><div>САМЫЙ БЫСТРЫЙ ШПРИЦ</div><strong id="winnerName"></strong></div></section></div><div id="countdown" class="countdown"></div><script>
const room=(new URLSearchParams(location.search).get('room')||'').toUpperCase(),$=x=>document.getElementById(x);let ws,state={players:[]},was=false;const wurl=()=>(location.protocol==='https:'?'wss://':'ws://')+location.host,jurl=()=>location.origin+'/join/'+room;function connect(){ws=new WebSocket(wurl());ws.onopen=()=>ws.send(JSON.stringify({type:'screen_join',room}));ws.onclose=()=>setTimeout(connect,1000);ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type!=='state')return;let start=!was&&m.running;was=m.running;state=m;if(start)await cd();render()}}async function cd(){$('countdown').classList.add('show');for(let x of ['3','2','1','ПОШЁЛ!']){$('countdown').textContent=x;await new Promise(r=>setTimeout(r,650))}$('countdown').classList.remove('show')}function render(){let p=state.players.filter(x=>x.connected),show=state.running||state.winner;$('count').textContent=p.length+' / 17';$('lobby').style.display=show?'none':'grid';$('race').style.display=show?'block':'none';$('lanes').innerHTML=p.map((x,i)=>{let q=Math.min(100,(x.position||0)/(state.finish||300)*100);return `<div class="syringe-lane"><div class="lane-name">${i+1}. ${x.name}</div><div class="lane-road"><div class="syringe-runner" style="left:${q*.88}%">💉</div><div class="peach-finish">🍑</div></div><div class="lane-pct">${Math.round(q)}%</div></div>`}).join('');$('winner').classList.toggle('show',!!state.winner);if(state.winner)$('winnerName').textContent=state.winner.name;$('subtitle').textContent=state.running?'ОРИ ГРОМЧЕ — ШПРИЦ ЛЕТИТ БЫСТРЕЕ!':state.winner?'ФИНИШ!':'Кто громче — тот быстрее доберётся до 🍑!'}$('roomCode').textContent=room;$('qr').src='/qr?text='+encodeURIComponent(jurl());connect();</script></body></html>
