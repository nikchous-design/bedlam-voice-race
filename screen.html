<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Накричи ЗА ребёнка — экран</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="stage" class="screen-stage">
  <header class="header">
    <h1 class="title"><span class="blue">Накричи</span> ЗА <span class="pink">ребёнка</span></h1>
    <div id="subtitle" class="subtitle">Сканируй QR, выбирай сторону и готовь голос!</div>
  </header>

  <main class="screen-main">
    <section class="screen-lobby">
      <div class="screen-team">
        <div class="team-head">💙 ЗА МАЛЬЧИКА</div>
        <img src="/baby-boy.svg" alt="">
        <div id="boyCount" class="big-count">0/3</div>
        <div class="team-level"><i id="boyLevel"></i></div>
      </div>

      <div class="screen-qr">
        <h2 style="margin:0 0 8px">СКАНИРУЙ QR</h2>
        <img id="qr" class="qr" alt="QR">
        <div class="tiny" style="margin-top:8px">КОД КОМНАТЫ</div>
        <div id="roomCode" class="room"></div>
      </div>

      <div class="screen-team">
        <div class="team-head">🩷 ЗА ДЕВОЧКУ</div>
        <img src="/baby-girl.svg" alt="">
        <div id="girlCount" class="big-count">0/3</div>
        <div class="team-level"><i id="girlLevel"></i></div>
      </div>
    </section>

    <section class="screen-race">
      <div class="race-title">КРИЧИ ЗА СВОЮ КОМАНДУ 🔊</div>

      <div class="track boy">
        <div class="track-label">💙 МАЛЬЧИК</div>
        <div class="progress-note" id="boyProgress">0%</div>
        <div id="boyRunner" class="runner"><img src="/baby-boy.svg" alt=""></div>
      </div>

      <div class="track girl">
        <div class="track-label">🩷 ДЕВОЧКА</div>
        <div class="progress-note" id="girlProgress">0%</div>
        <div id="girlRunner" class="runner"><img src="/baby-girl.svg" alt=""></div>
      </div>

      <div class="screen-winner-banner">
        <img id="winnerBaby" src="/baby-boy.svg" alt="">
        <div class="win-label">ПОБЕДИЛА</div>
        <div id="winnerText" class="who"></div>
      </div>
    </section>
  </main>

  <div class="screen-footer">Экран для гостей • управление идёт с ноутбука диджея</div>
</div>

<div id="countdown" class="countdown"></div>

<script>
const params=new URLSearchParams(location.search);
const room=(params.get('room')||'').toUpperCase();
const $=id=>document.getElementById(id);
let ws,state={players:[],running:false,winner:null,finish:300};
let wasRunning=false;

function wsUrl(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}
function joinUrl(){return location.origin+'/join/'+room}

function connect(){
  ws=new WebSocket(wsUrl());
  ws.onopen=()=>ws.send(JSON.stringify({type:'screen_join',room}));
  ws.onclose=()=>setTimeout(connect,1200);
  ws.onmessage=async e=>{
    const m=JSON.parse(e.data);
    if(m.type!=='state')return;

    const justStarted=!wasRunning&&m.running;
    wasRunning=m.running;
    state=m;

    if(justStarted){
      await countdown();
    }
    render();
  };
}

async function countdown(){
  $('countdown').classList.add('show');
  for(const x of ['3','2','1','КРИЧИ!']){
    $('countdown').textContent=x;
    await new Promise(r=>setTimeout(r,x==='КРИЧИ!'?500:650));
  }
  $('countdown').classList.remove('show');
}

function render(){
  const boys=state.players.filter(p=>p.team==='boy'&&p.connected);
  const girls=state.players.filter(p=>p.team==='girl'&&p.connected);

  $('boyCount').textContent=boys.length+'/3';
  $('girlCount').textContent=girls.length+'/3';

  const bl=boys.length?boys.reduce((a,p)=>a+p.level,0)/boys.length:0;
  const gl=girls.length?girls.reduce((a,p)=>a+p.level,0)/girls.length:0;
  $('boyLevel').style.width=bl*100+'%';
  $('girlLevel').style.width=gl*100+'%';

  const bp=state.players.find(p=>p.team==='boy')?.position||0;
  const gp=state.players.find(p=>p.team==='girl')?.position||0;
  const finish=state.finish||300;
  const bPct=Math.max(0,Math.min(100,bp/finish*100));
  const gPct=Math.max(0,Math.min(100,gp/finish*100));

  $('boyRunner').style.left=(6+bPct*.88)+'%';
  $('girlRunner').style.left=(6+gPct*.88)+'%';
  $('boyProgress').textContent=Math.round(bPct)+'%';
  $('girlProgress').textContent=Math.round(gPct)+'%';

  const stage=$('stage');
  stage.classList.toggle('racing',state.running||!!state.winner);
  stage.classList.toggle('finished',!!state.winner);

  if(state.winner){
    $('winnerText').textContent=state.winner.name;
    $('winnerBaby').src=state.winner.team==='boy'?'/baby-boy.svg':'/baby-girl.svg';
    $('subtitle').textContent='Финиш!';
  }else if(state.running){
    $('subtitle').textContent='КРИЧИ ГРОМЧЕ!';
  }else{
    $('subtitle').textContent='Сканируй QR, выбирай сторону и готовь голос!';
  }
}

if(!room){
  document.body.innerHTML='<div style="padding:40px;font-family:system-ui">Не указан код комнаты. Открой экран из панели диджея.</div>';
}else{
  $('roomCode').textContent=room;
  $('qr').src='/qr?text='+encodeURIComponent(joinUrl());
  connect();
}
</script>
</body>
</html>
